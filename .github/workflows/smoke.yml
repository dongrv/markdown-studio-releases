name: Verify Windows preview installer
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build workflow run ID
        required: true
        type: string
      version:
        description: Expected product version
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      STUDIO_EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markdown-studio-windows-x64
          path: installer
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Install into disposable runner and exercise the application
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem installer -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'markdown-studio-install'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = @(Get-ChildItem -LiteralPath $destination -Filter 'markdown-studio.exe' -Recurse)
          if ($executable.Count -ne 1) { throw 'Installed application not found' }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--force-renderer-accessibility'
          $app = Start-Process -FilePath $executable[0].FullName -WindowStyle Hidden -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $versionLabel = "v$env:STUDIO_EXPECTED_VERSION · 检查更新"
            $condition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, $versionLabel)
            $found = $false
            while ((Get-Date) -lt $deadline) {
              $app.Refresh()
              if ($app.HasExited) { throw "Installed application exited: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) {
                $root = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
                if ($null -ne $root -and $null -ne $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)) { $found = $true; break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $found) { throw 'Installed application version control did not appear in the Windows accessibility tree' }
            Write-Output "Installed application started and displayed version $env:STUDIO_EXPECTED_VERSION"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
