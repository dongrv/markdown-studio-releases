name: Verify Windows preview installer
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build workflow run ID
        required: true
        type: string
      version:
        description: Expected product version
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      STUDIO_EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: markdown-studio-windows-x64
          path: installer
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Install into disposable runner and exercise the application
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem installer -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'markdown-studio-install'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = @(Get-ChildItem -LiteralPath $destination -Filter 'markdown-studio.exe' -Recurse)
          if ($executable.Count -ne 1) { throw 'Installed application not found' }
          node .github/workflows/studio-release-smoke.mjs $executable[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
